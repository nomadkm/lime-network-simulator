<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>Lime Network Simulator</title>
<style>
:root{--bg:#12161c;--p:#1a2029;--b:#2a3340;--t:#e6edf3;--m:#8b98a8;--l:#9be21f}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:13px Segoe UI,sans-serif;overflow:hidden}
button{background:#232c38;color:var(--t);border:1px solid var(--b);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
button:hover{border-color:var(--l)}button.on{background:var(--l);color:#111;border-color:var(--l)}
#load{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}
#load h1{margin:0;font-size:26px;color:var(--l)}#load p{margin:0;color:var(--m)}
.sp{width:38px;height:38px;border:4px solid var(--b);border-top-color:var(--l);border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
#app{display:grid;grid-template-columns:150px 1fr 290px;grid-template-rows:46px 1fr 130px;height:100%}
#top{grid-column:1/4;background:var(--p);border-bottom:1px solid var(--b);display:flex;gap:6px;align-items:center;padding:0 10px}
#top b{color:var(--l);margin-right:10px}#pal{background:var(--p);border-right:1px solid var(--b);padding:8px;overflow:auto;display:flex;flex-direction:column;gap:5px}
#pal small{color:var(--m);margin-top:6px;text-transform:uppercase}#pal button{text-align:left}
#cv{width:100%;height:100%;display:block}#cw{position:relative;overflow:hidden}
#side{background:var(--p);border-left:1px solid var(--b);padding:12px;overflow:auto;line-height:1.5}
#side h3{margin:0 0 6px;color:var(--l)}#side .r{margin:6px 0;color:var(--m)}#side .bx{background:#10151b;border:1px solid var(--b);border-radius:6px;padding:8px;margin:8px 0}
#log{grid-column:1/4;background:#0d1116;border-top:1px solid var(--b);padding:6px 10px;overflow:auto;font:12px Consolas,monospace}
.ok{color:#8bc34a}.er{color:#ff6b6b}.in{color:#7fb7ff}.wr{color:#ffc247}
#md{position:fixed;inset:0;background:#000a;z-index:8;display:none;align-items:center;justify-content:center}
#md>div{background:var(--p);border:1px solid var(--b);border-radius:10px;width:760px;max-width:94%;height:78%;display:flex;flex-direction:column}
#mh{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--b)}#mb{padding:14px;overflow:auto;line-height:1.55}
#mb h4{margin:12px 0 4px;color:var(--l)}#mb code{background:#10151b;padding:1px 5px;border-radius:4px}
.hint{position:absolute;left:10px;top:8px;color:var(--m);pointer-events:none}
</style></head><body>
<div id="load"><svg width="110" height="110" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#9be21f"/><circle cx="50" cy="50" r="40" fill="#c8f56a"/><circle cx="50" cy="50" r="6" fill="#9be21f"/><g stroke="#9be21f" stroke-width="3"><path d="M50 50V12M50 50L83 31M50 50L83 69M50 50V88M50 50L17 69M50 50L17 31"/></g><circle cx="50" cy="50" r="40" fill="none" stroke="#6fae0f" stroke-width="3"/></svg>
<h1>Lime Network Simulator</h1><p>Yükleniyor...</p><div class="sp"></div></div>
<div id="app">
<div id="top"><b>🍋 Lime</b>
<button id="run" class="on">⏸ Duraklat</button><button id="ping">📨 Paket Gönder</button>
<select id="proto" style="background:#232c38;color:#fff;border:1px solid #2a3340;border-radius:6px;padding:6px"><option>ICMP</option><option>ARP</option><option>TCP</option><option>UDP</option><option>HTTP</option><option>DNS</option><option>DHCP</option></select>
<button id="guide">📚 Rehber / Eğitim</button><button id="clr">🧹 Logu Temizle</button><button id="clrall">🗑 Tümünü Sil</button><button id="undo">↶ Geri Al</button><button id="redo">↷ Yinele</button><button id="save">💾 Kaydet</button><button id="open">📂 Aç</button><select id="lng" style="margin-left:auto;background:#232c38;color:#fff;border:1px solid #2a3340;border-radius:6px;padding:6px"><option value="tr">Türkçe</option><option value="en">English</option></select><input type="file" id="fi" accept=".json" hidden></div>
<div id="pal"></div>
<div id="cw"><canvas id="cv"></canvas><div class="hint">Sol/sağ tık sürükle: gez · Tekerlek: yakınlaştır</div></div>
<div id="side"></div>
<div id="log"></div></div>
<div id="md"><div><div id="mh"></div><div id="mb"></div></div></div>
<script>
const $=i=>document.getElementById(i);
const DEV={
pc:{n:'Bilgisayar',e:'🖥️',mx:1000,ip:1,dte:1,f:0,d:'Uç kullanıcı cihazı. IP adresi alır, uygulamaları çalıştırır.',c:'Switch/Hub/AP ile DÜZ kablo, Router/PC ile ÇAPRAZ kablo kullanın.'},
laptop:{n:'Dizüstü',e:'💻',mx:1000,ip:1,w:1,dte:1,f:0,d:'Taşınabilir uç cihaz; kablolu veya kablosuz bağlanır.',c:'Switch ile DÜZ, bilgisayarla ÇAPRAZ kablo.'},
server:{n:'Sunucu',e:'🗄️',mx:10000,ip:1,dte:1,f:1,d:'Web, DNS, DHCP, FTP gibi servisleri sağlar.',c:'Switch ile DÜZ (veya fiber). Router ile ÇAPRAZ.'},
switch:{n:'Switch',e:'🔀',mx:10000,dte:0,f:1,d:'MAC adres tablosuyla çerçeveleri yalnızca ilgili porta iletir (OSI Katman 2). VLAN ve STP destekler.',c:'Uç cihazlarla DÜZ; başka switch/hub ile ÇAPRAZ; router ile DÜZ.'},
hub:{n:'Hub',e:'🔌',mx:100,dte:0,f:0,d:'Gelen veriyi tüm portlara çoğaltır (Katman 1). Çakışma alanı oluşturur.',c:'Uç cihazlarla DÜZ; switch/hub ile ÇAPRAZ.'},
ap:{n:'Access Point',e:'📡',mx:1000,wf:1,ip:1,dte:0,f:0,d:'Kablosuz istemcileri kablolu ağa bağlar (802.11).',c:'Switch ile ÇAPRAZ, router ile DÜZ kablo. Wi-Fi istemcileri için standart (802.11b/g/n/ac/ax) seçin.'},
router:{n:'Router',e:'🧭',mx:10000,wf:1,ip:1,dte:1,f:1,d:'Farklı ağlar arasında IP tabanlı yönlendirme (Katman 3). NAT, OSPF, RIP, BGP.',c:'Switch ile DÜZ; router/PC ile ÇAPRAZ; uzun mesafe için FİBER.'},
firewall:{n:'Firewall',e:'🧱',mx:10000,ip:1,dte:1,f:1,d:'Kurallara göre trafiği filtreler, saldırıları engeller.',c:'Router ve switch arasına; Switch ile DÜZ.'},
modem:{n:'Modem',e:'📶',mx:100,wf:1,dte:0,f:1,d:'Servis sağlayıcı hattını (DSL/Fiber) Ethernet’e çevirir.',c:'Router ile DÜZ kablo veya FİBER.'},
phone:{n:'Akıllı Telefon',e:'📱',dte:1,f:0,w:1,nw:1,ip:1,d:'Wi-Fi ile bağlanan mobil cihaz. Kablo portu yoktur.',c:'Yalnızca Wi-Fi: Wi-Fi aracını seçip telefonu Wi-Fi vericisine (AP, Router, Modem) sürükleyin; AP menzilinde olmalı.'},
iot:{n:'IoT Cihazı',e:'🌡️',dte:1,f:0,w:1,nw:1,ip:1,d:'Sensör, akıllı priz, kamera gibi düşük güçlü kablosuz cihazlar.',c:'Yalnızca Wi-Fi: AP menzilinde olmalı. Mesafe arttıkça sinyal ve hız düşer.'},
ddos:{n:'DDoS Temizleme',e:'🛡️',dte:1,f:1,mx:10000,ip:1,d:'Trafiği analiz eder; botnet kaynaklı DDoS paketlerini çöpe atar. Saldırı yapan IP’yi bir süre sonra bloklar.',c:'Firewall/router ile ve saldırıdan korunacak sunucunun önüne, trafiğin geçtiği yola yerleştirin. Switch ile DÜZ, router ile ÇAPRAZ kablo.'},
mesh:{n:'Mesh Wi-Fi',e:'🕸️',dte:0,f:0,mx:1000,wf:1,ip:1,d:'Birden fazla düğümle evin her yerine tek ağ gibi Wi-Fi yayar. Düğümler birbirine kablosuz (backhaul) veya kablolu bağlanır ve kendi aralarında kanal çakışması yapmaz.',c:'Router/modeme DÜZ kablo veya Wi-Fi ile bağlanır; diğer mesh düğümleriyle Wi-Fi aracıyla bağlanır. İstemciler menzildeki düğüme Wi-Fi ile bağlanır.'},
dns:{n:'DNS Sunucusu',e:'📖',dte:1,f:1,mx:10000,ip:1,d:'Alan adlarını IP adreslerine çevirir. Doğrudan bağlı olduğu sunucuya dünyada popüler bir sitenin adını (google.com, youtube.com…) verir.',c:'Alan adı vermek istediğiniz sunucuya doğrudan ÇAPRAZ kabloyla (aynı grup) veya FİBER ile bağlayın.'},
olt:{n:'OLT',e:'🏢',mx:10000,fo:1,dte:1,f:1,ip:1,d:'FTTx (GPON/EPON) altyapısında servis sağlayıcı tarafındaki optik hat terminali. ONT’leri besler.',c:'Tüm portları yalnızca FİBER’dir; bakır kablo kabul etmez.'},
ont:{n:'ONT',e:'📦',mx:2500,dte:0,f:1,d:'Abone tarafındaki optik ağ sonlandırıcı; fiber hattı Ethernet’e çevirir.',c:'OLT ile FİBER; router ile DÜZ kablo.'}};
const CAB={straight:{n:'Düz (bakır)',c:'#8bc34a',s:.2},cross:{n:'Çapraz (bakır)',c:'#ffb74d',s:.2},fiber:{n:'Fiber optik',c:'#4dd0e1',s:.65},wifi:{n:'Wi-Fi (kablosuz)',c:'#c792ea',s:.2}};
const STD={b:{n:'802.11b',r:300,s:.06,v:11,m:'11 Mbps, 2.4 GHz'},g:{n:'802.11g',r:280,s:.1,v:54,m:'54 Mbps, 2.4 GHz'},n:{n:'802.11n',r:320,s:.2,v:300,m:'300 Mbps, 2.4/5 GHz'},ac:{n:'802.11ac',r:240,s:.4,v:867,m:'867 Mbps, 5 GHz'},ax:{n:'802.11ax (Wi-Fi 6)',r:270,s:.6,v:1200,m:'1.2 Gbps+, 2.4/5 GHz'}};
const apOf=l=>hasWf(dv(l.a))?dv(l.a):dv(l.b);
function sig(l){const a=dv(l.a),b=dv(l.b);return 1-Math.hypot(a.x-b.x,a.y-b.y)/STD[apOf(l).std||'n'].r}
const CAT={'5':{n:'Cat5',v:100,m:100},'5e':{n:'Cat5e',v:1000,m:100},'6':{n:'Cat6',v:1000,m:100},'6a':{n:'Cat6a',v:10000,m:100},mm:{n:'Fiber çok modlu',v:10000,m:300},sm:{n:'Fiber tek modlu',v:100000,m:20000}};
const hasWf=d=>DEV[d.type].wf&&(d.type!='router'||d.wifi);
const band=d=>d.std=='ac'?5:2.4;
function conf(d){return devs.some(o=>o!=d&&hasWf(o)&&band(o)==band(d)&&!(o.type=='mesh'&&d.type=='mesh')&&Math.abs(o.ch-d.ch)<5&&Math.hypot(o.x-d.x,o.y-d.y)<STD[o.std||'n'].r+STD[d.std||'n'].r)}
function intf(l){const ap=apOf(l),a=dv(l.a),b=dv(l.b),c=ap==a?b:a;let I=0;for(const o of devs){if(o==ap||(o.type=='mesh'&&ap.type=='mesh')||!hasWf(o)||band(o)!=band(ap))continue;const df=Math.abs(o.ch-ap.ch);if(df>=5)continue;I+=(1-df/5)*Math.max(0,1-Math.hypot(o.x-c.x,o.y-c.y)/STD[o.std||'n'].r)}return I}
const port=d=>d.eth||DEV[d.type].mx;
function HW(d){const I=DEV[d.type],st='style="background:#232c38;color:#fff;border:1px solid #2a3340;border-radius:6px;padding:4px"';let h='';
if(d.type=='pc'||d.type=='laptop')h+=`Ethernet hızı: <select ${st} onchange="setEth(this.value)">${[100,1000,2500,10000].map(v=>`<option value="${v}" ${(d.eth||1000)==v?'selected':''}>${fmt(v)}</option>`).join('')}</select><br>`;
if(I.w)h+=`Wi-Fi sürümü: <select ${st} onchange="setWs(this.value)">${Object.keys(STD).map(k=>`<option value="${k}" ${(d.wstd||'n')==k?'selected':''}>${STD[k].n}</option>`).join('')}</select><br>`;
if(d.type=='switch')h+=`<label><input type="checkbox" ${d.stp!==0?'checked':''} onchange="setStp(this.checked)"> STP (Spanning Tree) açık</label><br>`;
if(d.site)h+=`🌐 Alan adı: <b>${d.site}</b>`;
if(d.type=='dns'){const r=devs.filter(x=>x.site&&links.some(l=>l.plugged&&((l.a==x.id&&l.b==d.id)||(l.b==x.id&&l.a==d.id))));h+='<b>Kayıtlar</b><br>'+(r.length?r.map(x=>x.site+' → '+x.ip).join('<br>'):'<small>Henüz kayıt yok. Bir sunucuya doğrudan kablo bağlayın.</small>')}
return h?`<div class="bx">${h}</div>`:''}
function setEth(v){snap();const d=dv(sel.id);d.eth=+v;log(`${d.name}: Ethernet ${fmt(+v)} yapıldı.`,'wr');panel()}
function setWs(v){snap();const d=dv(sel.id);d.wstd=v;log(`${d.name}: Wi-Fi sürümü ${STD[v].n} yapıldı.`,'wr');panel()}
function dnsSync(){for(const s of devs){if(s.type!='server')continue;const c=links.some(l=>{if(!l.plugged||(l.a!=s.id&&l.b!=s.id))return 0;const o=dv(l.a==s.id?l.b:l.a);return o.type=='dns'&&chk(l)[0]});
if(c&&!s.site){const fr=SITES.filter(x=>!devs.some(d=>d.site==x));s.site=fr.length?fr[Math.floor(Math.random()*fr.length)]:'site'+s.id+'.com';log(`🌐 DNS: ${s.name} (${s.ip}) için ${s.site} kaydı oluşturuldu.`,'ok');if(sel)panel()}
else if(!c&&s.site){log(`🌐 DNS bağlantısı koptu: ${s.site} artık çözümlenmiyor.`,'wr');s.site=null;if(sel)panel()}}}
const dm=l=>{const a=dv(l.a),b=dv(l.b);return Math.round(Math.hypot(a.x-b.x,a.y-b.y)*.25)};
const catOf=l=>l.cat||(l.cable=='fiber'?'sm':'5e');
const fmt=v=>v>=1000?+(v/1000).toFixed(1)+' Gbps':v+' Mbps';
function mbps(l){if(l.cable=='wifi'){const a=dv(l.a),b=dv(l.b),ap=apOf(l),cl=ap==a?b:a,sa=STD[ap.std||'n'].v,sc=hasWf(cl)?STD[cl.std||'n'].v:STD[cl.wstd||'n'].v;return Math.round(Math.min(sa,sc)*(.3+.7*Math.max(0,sig(l)))/(1+1.5*intf(l)))};const a=dv(l.a),b=dv(l.b),d=dm(l),c=CAT[catOf(l)];let v=c.v;if(catOf(l)=='6')v=d<=55?10000:1000;v*=1-.5*Math.max(0,(d-c.m/2)/(c.m/2));return Math.round(Math.min(v,port(a),port(b)))}
const spd=l=>Math.min(1,Math.max(.03,.012*Math.sqrt(mbps(l))));
function newIP(){let ip;do ip=`192.168.${Math.floor(Math.random()*10)}.${2+Math.floor(Math.random()*253)}`;while(devs.some(d=>d.ip==ip));return ip}
const PROTO={ARP:'IP→MAC çözümler.',ICMP:'Ping; erişilebilirlik testi.',IP:'Adresleme ve yönlendirme.',TCP:'Güvenilir, bağlantı yönelimli taşıma.',UDP:'Hızlı, bağlantısız taşıma.',DHCP:'Otomatik IP dağıtımı.',DNS:'İsim→IP çözümleme.',HTTP:'Web (HTTPS şifreli).',FTP:'Dosya aktarımı.',SSH:'Güvenli uzak yönetim.',Telnet:'Şifresiz uzak yönetim.',SMTP:'E-posta gönderimi.',STP:'Switch döngü engelleme.',VLAN:'Mantıksal ağ ayrımı (802.1Q).',NAT:'Özel→genel IP çevirisi.',OSPF:'Link-state iç yönlendirme.',RIP:'Mesafe-vektör yönlendirme.',BGP:'İnternet ölçeğinde yönlendirme.'};
const GRP={'Uç Cihazlar':['pc','laptop','phone','iot'],'Ağ Cihazları':['switch','hub','router','modem'],'Kablosuz':['ap','mesh'],'Sunucular':['server','dns'],'Güvenlik':['firewall','ddos'],'Servis Sağlayıcı (FTTx)':['olt','ont']};
const SITES=['google.com','youtube.com','facebook.com','wikipedia.org','amazon.com','instagram.com','x.com','netflix.com','whatsapp.com','tiktok.com','linkedin.com','reddit.com','yahoo.com','microsoft.com','apple.com','github.com','twitch.tv','spotify.com','zoom.us','openai.com'];
let devs=[],links=[],pk=[],glow={},nid=1,view={x:0,y:0,z:1},tool='sel',sel=null,running=true,pingSrc=null,bad={},drag=null,cur={x:0,y:0};
const cv=$('cv'),cx=cv.getContext('2d');
function log(m,c='in'){const d=document.createElement('div');d.className=c;d.textContent=new Date().toLocaleTimeString()+'  '+tr(m);$('log').append(d);$('log').scrollTop=1e9}
function pal0(){let h='';for(const g in GRP){h+=`<small>${g}</small>`;for(const k of GRP[g])h+=`<button data-t="${k}" class="${tool=='add:'+k?'on':''}">${DEV[k].e} <span>${DEV[k].n}</span></button>`}
h+='<small>KABLOLAR</small>';for(const k in CAB)h+=`<button data-t="${k}" class="${tool==k?'on':''}">${k=='fiber'?'💡':k=='wifi'?'📶':'🔗'} <span>${CAB[k].n}</span></button>`;
h+=`<small>ARAÇ</small><button data-t="sel" class="${tool=='sel'?'on':''}">🖱️ <span>Seç / Taşı</span></button>`;$('pal').innerHTML=h;
$('pal').querySelectorAll('button').forEach(b=>b.onclick=()=>{const t=b.dataset.t;tool=DEV[t]?'add:'+t:t;pingSrc=null;$('ping').classList.remove('on');pal()})}
function chk(l){const a=dv(l.a),b=dv(l.b),A=DEV[a.type],B=DEV[b.type];
if(l.cable=='wifi'&&hasWf(a)&&hasWf(b)){if(a.type!='mesh'&&b.type!='mesh')return[0,'İki Wi-Fi vericisi yalnızca mesh düğümü aracılığıyla kablosuz bağlanabilir.'];if(sig(l)<=0)return[0,'Mesh düğümleri birbirinin menzili dışında; yaklaştırın.'];return[1,'']}
if(l.cable=='wifi'){const ap=hasWf(a)?a:b,cl=ap==a?b:a;if(!hasWf(ap)||!DEV[cl.type].w)return[0,'Wi-Fi yalnızca Wi-Fi vericisi (Access Point, Router, Modem) ile kablosuz destekli cihaz (dizüstü, telefon, IoT) arasında kurulur.'];if(sig(l)<=0)return[0,`${cl.name}, ${ap.name} (${STD[ap.std||'n'].n}) menzili dışında; cihazı yaklaştırın veya daha uzun menzilli standart seçin.`];return[1,'']}
if(A.fo||B.fo)if(l.cable!='fiber')return[0,`${A.fo?a.name:b.name} yalnızca FİBER ile çalışır; bakır kablo takılamaz.`];
if(l.cable!='wifi'){const c=CAT[catOf(l)],d=dm(l);if(d>c.m)return[0,`Kablo mesafesi ${d} m; ${c.n} en fazla ${c.m} m destekler.`]}
if(A.nw||B.nw)return[0,`${A.nw?a.name:b.name} yalnızca Wi-Fi destekler; kablo takılamaz.`];
if((a.type=='olt'&&b.type=='ont'||a.type=='ont'&&b.type=='olt')&&l.cable!='fiber')return[0,'OLT–ONT arası yalnızca FİBER ile bağlanır.'];
if(l.cable=='fiber'){if(!A.f||!B.f)return[0,`Fiber: ${!A.f?a.name:b.name} fiber portu desteklemiyor.`];return[1,'']}
if(l.cable=='straight'&&A.dte==B.dte)return[0,`Aynı tür cihazlar (${a.name}–${b.name}) arasında DÜZ kablo çalışmaz; ÇAPRAZ gerekir.`];
if(l.cable=='cross'&&A.dte!=B.dte)return[0,`Farklı tür cihazlar (${a.name}–${b.name}) arasında ÇAPRAZ kablo çalışmaz; DÜZ gerekir.`];return[1,'']}
const dv=id=>devs.find(d=>d.id==id),lk=id=>links.find(l=>l.id==id);
function name(t){return tr(DEV[t].n)+(devs.filter(d=>d.type==t).length+1)}
function W(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-view.x)/view.z,y:(e.clientY-r.top-view.y)/view.z}}
const hitD=p=>[...devs].reverse().find(d=>Math.abs(p.x-d.x)<36&&Math.abs(p.y-d.y)<30);
function hitL(p){return links.find(l=>{const a=dv(l.a),b=dv(l.b),dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)<8/view.z})}
function place(p){snap();const t=tool.slice(4);devs.push({id:nid++,type:t,x:p.x,y:p.y,name:name(t),ip:DEV[t].ip?newIP():null,std:DEV[t].wf?(t=='mesh'?'ax':'n'):null,ch:DEV[t].wf?[1,6,11][Math.floor(Math.random()*3)]:null});log(DEV[t].n+' eklendi.');tool='sel';pal();sel={k:'d',id:devs.at(-1).id};panel();}
cv.onmousedown=e=>{const p=W(e),d=hitD(p);cur=p;
if(e.button==1||e.button==2){drag={k:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};e.preventDefault();return}
